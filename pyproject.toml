[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemosine-mind"
version = "1.0.3"
description = "MiND: A Minimal Deterministic Middleware for Auditing, Reproducing, and Logging Large Language Model Interactions in Research Workflows."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
authors = [
  { name = "Edervaldo José de Souza Melo" }
]
keywords = [
  "deterministic middleware",
  "reproducible AI",
  "LLM auditing",
  "logging",
  "research software"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries"
]
dependencies = []

[project.scripts]
mind = "nemosine_mind.cli:main"

[project.optional-dependencies]
http = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
]
ui = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
]
openai = [
  "openai>=1.40",
]
anthropic = [
  "anthropic>=0.40",
]
providers = [
  "openai>=1.40",
  "anthropic>=0.40",
]
test = [
  "fastapi>=0.111",
  "httpx>=0.27",
  "httpx2>=2.0; python_version >= '3.10'",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
dev = [
  "build>=1.2",
  "fastapi>=0.111",
  "httpx>=0.27",
  "httpx2>=2.0",
  "mypy>=1.10,<2",
  "openai>=1.40",
  "anthropic>=0.40",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "twine>=5.1",
  "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/edersouzamelo/nemosine-10-MiND"
Repository = "https://github.com/edersouzamelo/nemosine-10-MiND"
Documentation = "https://github.com/edersouzamelo/nemosine-10-MiND"
Archive = "https://doi.org/10.5281/zenodo.18637799"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["nemosine_mind*"]

[tool.setuptools.package-data]
"nemosine_mind.ui" = ["*.html", "*.css", "*.js", "*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
filterwarnings = [
  "error",
  "ignore:Please use `import python_multipart` instead\\.:PendingDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["nemosine_mind"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src/nemosine_mind"]
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
