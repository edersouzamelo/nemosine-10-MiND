name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/**"
    paths:
      - ".github/workflows/windows-installer.yml"
      - "packaging/**"
      - "src/**"
      - "pyproject.toml"

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Build and verify Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[ui,providers]" "pyinstaller>=6.10,<7"

      - name: Verify desktop launcher before packaging
        run: python packaging/windows_launcher.py --smoke-test

      - name: Build console diagnostics application
        run: >-
          pyinstaller --noconfirm --clean
          --distpath dist-diagnostics
          --workpath build-diagnostics
          packaging/windows/mind-smoke.spec

      - name: Verify frozen application with diagnostics
        shell: pwsh
        env:
          MIND_SMOKE_REPORT: ${{ runner.temp }}\mind-diagnostics-smoke.txt
        run: |
          & ".\dist-diagnostics\MiND-Diagnostics\MiND-Diagnostics.exe" --smoke-test
          if (Test-Path $env:MIND_SMOKE_REPORT) { Get-Content $env:MIND_SMOKE_REPORT }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build self-contained application directory
        run: pyinstaller --noconfirm --clean packaging/windows/mind-windows.spec

      - name: Verify packaged application
        shell: pwsh
        env:
          MIND_SMOKE_REPORT: ${{ runner.temp }}\mind-packaged-smoke.txt
        run: |
          $process = Start-Process -FilePath ".\dist\MiND\MiND.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if (Test-Path $env:MIND_SMOKE_REPORT) { Get-Content $env:MIND_SMOKE_REPORT }
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      - name: Install WiX Toolset
        id: wix
        shell: pwsh
        run: |
          $candle = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin\candle.exe"
          $light = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin\light.exe"
          $heat = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin\heat.exe"
          if (-not (Test-Path $candle)) {
            choco install wixtoolset --no-progress -y
          }
          if (-not (Test-Path $candle) -or -not (Test-Path $light) -or -not (Test-Path $heat)) {
            throw "WiX Toolset was not found"
          }
          "candle=$candle" >> $env:GITHUB_OUTPUT
          "light=$light" >> $env:GITHUB_OUTPUT
          "heat=$heat" >> $env:GITHUB_OUTPUT

      - name: Build native Windows Installer package
        shell: pwsh
        run: |
          $version = python -c "from nemosine_mind import __version__; print(__version__)"
          New-Item -ItemType Directory -Force -Path ".\build-msi", ".\dist-installer" | Out-Null
          & "${{ steps.wix.outputs.heat }}" dir ".\dist\MiND" `
            -cg MindFiles -dr INSTALLFOLDER -gg -scom -sreg -sfrag -srd `
            -var var.MindSource -out ".\build-msi\mind-files.wxs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${{ steps.wix.outputs.candle }}" `
            -arch x64 `
            "-dMindVersion=$version" `
            "-dMindSource=$pwd\dist\MiND" `
            -ext WixUIExtension -ext WixUtilExtension `
            -out ".\build-msi\" `
            ".\packaging\windows\mind-installer.wxs" `
            ".\build-msi\mind-files.wxs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${{ steps.wix.outputs.light }}" `
            -ext WixUIExtension -ext WixUtilExtension `
            -cultures:pt-BR `
            -out ".\dist-installer\MiND-$version-windows-x64.msi" `
            ".\build-msi\mind-installer.wixobj" `
            ".\build-msi\mind-files.wixobj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify clean MSI install, launch and uninstall
        shell: pwsh
        env:
          MIND_SMOKE_REPORT: ${{ runner.temp }}\mind-installed-smoke.txt
        run: |
          $setup = Get-ChildItem ".\dist-installer\MiND-*-windows-x64.msi" | Select-Object -First 1
          if (-not $setup) { throw "MSI installer was not generated" }
          $installDir = Join-Path $env:RUNNER_TEMP "mind-installed"
          $installLog = Join-Path $env:RUNNER_TEMP "mind-msi-install.log"
          $process = Start-Process -FilePath "msiexec.exe" `
            -ArgumentList "/i", "`"$($setup.FullName)`"", "/qn", "/norestart", "INSTALLFOLDER=`"$installDir`"", "/l*v", "`"$installLog`"" `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content $installLog
            exit $process.ExitCode
          }
          if (-not (Test-Path "$installDir\MiND.exe")) { throw "MiND.exe was not installed" }
          $smoke = Start-Process -FilePath "$installDir\MiND.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if (Test-Path $env:MIND_SMOKE_REPORT) { Get-Content $env:MIND_SMOKE_REPORT }
          if ($smoke.ExitCode -ne 0) { exit $smoke.ExitCode }
          $uninstallLog = Join-Path $env:RUNNER_TEMP "mind-msi-uninstall.log"
          $remove = Start-Process -FilePath "msiexec.exe" `
            -ArgumentList "/x", "`"$($setup.FullName)`"", "/qn", "/norestart", "/l*v", "`"$uninstallLog`"" `
            -Wait -PassThru
          if ($remove.ExitCode -ne 0) {
            Get-Content $uninstallLog
            exit $remove.ExitCode
          }
          if (Test-Path "$installDir\MiND.exe") { throw "MSI uninstall left MiND.exe behind" }
          Get-FileHash $setup.FullName -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $($setup.Name)" | Set-Content ".\dist-installer\SHA256SUMS.txt"
          }

      - name: Publish authorized Windows preview
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-installer]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem ".\dist-installer\MiND-*-windows-x64.msi" | Select-Object -First 1
          if (-not $setup) { throw "MSI installer was not generated" }
          $checksum = Get-Item ".\dist-installer\SHA256SUMS.txt"
          $version = python -c "from nemosine_mind import __version__; print(__version__)"
          $tag = "v$version-windows-preview.2"
          $title = "MiND $version para Windows, Preview 2"
          $notes = @"
          Instalador MSI autocontido do MiND para Windows.

          Inclui:
          - interface local de auditoria;
          - instalação nativa do Windows, sem Python, ZIP, BAT ou executor temporário;
          - atalho no menu Iniciar;
          - atalhos no menu Iniciar e na área de trabalho;
          - controlador local para abrir e encerrar o MiND;
          - providers OpenAI e Anthropic incluídos para a próxima etapa visual.

          Esta versão substitui o Preview 1, cujo executor temporário foi bloqueado pelo Avast. Ainda é uma versão de teste sem assinatura digital; Windows ou antivírus podem solicitar confirmação de publicador desconhecido.
          "@
          gh release create $tag $setup.FullName $checksum.FullName `
            --prerelease `
            --target "$env:GITHUB_SHA" `
            --title $title `
            --notes $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: mind-windows-installer
          path: |
            dist-installer/MiND-*-windows-x64.msi
            dist-installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
