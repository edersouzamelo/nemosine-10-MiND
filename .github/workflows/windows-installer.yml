name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/**"
    paths:
      - ".github/workflows/windows-installer.yml"
      - "packaging/**"
      - "src/**"
      - "pyproject.toml"

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Build and verify Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[ui,providers]" "pyinstaller>=6.10,<7"

      - name: Verify desktop launcher before packaging
        run: python packaging/windows_launcher.py --smoke-test

      - name: Build console diagnostics application
        run: >-
          pyinstaller --noconfirm --clean
          --distpath dist-diagnostics
          --workpath build-diagnostics
          packaging/windows/mind-smoke.spec

      - name: Verify frozen application with diagnostics
        shell: pwsh
        env:
          MIND_SMOKE_REPORT: ${{ runner.temp }}\mind-diagnostics-smoke.txt
        run: |
          & ".\dist-diagnostics\MiND-Diagnostics\MiND-Diagnostics.exe" --smoke-test
          if (Test-Path $env:MIND_SMOKE_REPORT) { Get-Content $env:MIND_SMOKE_REPORT }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build self-contained application directory
        run: pyinstaller --noconfirm --clean packaging/windows/mind-windows.spec

      - name: Verify packaged application
        shell: pwsh
        env:
          MIND_SMOKE_REPORT: ${{ runner.temp }}\mind-packaged-smoke.txt
        run: |
          $process = Start-Process -FilePath ".\dist\MiND\MiND.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if (Test-Path $env:MIND_SMOKE_REPORT) { Get-Content $env:MIND_SMOKE_REPORT }
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found"
          }
          "compiler=$compiler" >> $env:GITHUB_OUTPUT

      - name: Build one-click installer
        shell: pwsh
        run: |
          $version = python -c "from nemosine_mind import __version__; print(__version__)"
          & "${{ steps.inno.outputs.compiler }}" "/DMindVersion=$version" "packaging\windows\mind-installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify clean installer path
        shell: pwsh
        env:
          MIND_SMOKE_REPORT: ${{ runner.temp }}\mind-installed-smoke.txt
        run: |
          $setup = Get-ChildItem ".\dist-installer\MiND-Setup-*-windows-x64.exe" | Select-Object -First 1
          if (-not $setup) { throw "Installer was not generated" }
          $installDir = Join-Path $env:RUNNER_TEMP "mind-installed"
          $process = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $smoke = Start-Process -FilePath "$installDir\MiND.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if (Test-Path $env:MIND_SMOKE_REPORT) { Get-Content $env:MIND_SMOKE_REPORT }
          if ($smoke.ExitCode -ne 0) { exit $smoke.ExitCode }
          Get-FileHash $setup.FullName -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $($setup.Name)" | Set-Content ".\dist-installer\SHA256SUMS.txt"
          }

      - name: Publish authorized Windows preview
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-installer]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem ".\dist-installer\MiND-Setup-*-windows-x64.exe" | Select-Object -First 1
          if (-not $setup) { throw "Installer was not generated" }
          $checksum = Get-Item ".\dist-installer\SHA256SUMS.txt"
          $version = python -c "from nemosine_mind import __version__; print(__version__)"
          $tag = "v$version-windows-preview.1"
          $title = "MiND $version para Windows, Preview 1"
          $notes = @"
          Primeiro instalador autocontido do MiND para Windows.

          Inclui:
          - interface local de auditoria;
          - instalação sem Python, ZIP ou arquivo BAT;
          - atalho no menu Iniciar;
          - atalho opcional na área de trabalho;
          - controlador local para abrir e encerrar o MiND;
          - providers OpenAI e Anthropic incluídos para a próxima etapa visual.

          Esta é uma versão de teste ainda sem assinatura digital. Windows ou antivírus podem solicitar confirmação de publicador desconhecido.
          "@
          gh release create $tag $setup.FullName $checksum.FullName `
            --prerelease `
            --target "$env:GITHUB_SHA" `
            --title $title `
            --notes $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: mind-windows-installer
          path: |
            dist-installer/MiND-Setup-*-windows-x64.exe
            dist-installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
