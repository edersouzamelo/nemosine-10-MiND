name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip ".[test]"

      - name: Run tests with coverage
        run: python -m pytest --cov=nemosine_mind --cov-report=term-missing

  minimum-dependencies:
    name: Minimum supported dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install declared minimums
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install \
            fastapi==0.111.0 \
            httpx==0.27.0 \
            pydantic==2.7.0 \
            pytest==8.0.0 \
            pytest-cov==5.0.0

      - name: Run tests against minimums
        run: python -m pytest --cov=nemosine_mind --cov-report=term-missing

  quality:
    name: Lint and type checking
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --upgrade pip ".[dev]"

      - name: Check code
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy

  package:
    name: Build and clean-wheel smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Install base wheel without dependencies
        run: |
          python -m venv /tmp/mind-wheel-smoke
          /tmp/mind-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl

      - name: Run offline smoke test
        env:
          MIND_DATA_DIR: /tmp/mind-wheel-data
        run: |
          /tmp/mind-wheel-smoke/bin/mind demo "CI offline demo"
          /tmp/mind-wheel-smoke/bin/mind doctor
          /tmp/mind-wheel-smoke/bin/mind cycles --json
          /tmp/mind-wheel-smoke/bin/python -c "import importlib.util; assert importlib.util.find_spec('fastapi') is None; assert importlib.util.find_spec('openai') is None; assert importlib.util.find_spec('anthropic') is None"

      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
